apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      nodeSelector:
        role: general
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          command:
            - /bin/sh
            - -c
            - |
              cat << 'NGINX' > /etc/nginx/conf.d/default.conf
              server {
                  listen 8080;
                  location /healthz { return 200 '{"status":"alive","service":"frontend"}'; add_header Content-Type application/json; }
                  location /ready { return 200 '{"status":"ready","service":"frontend"}'; add_header Content-Type application/json; }
                  location / { return 200 '{"service":"frontend","version":"v1","platform":"HCL-GKE-ECommerce"}'; add_header Content-Type application/json; }
              }
              NGINX
              exec nginx -g 'daemon off;'
          envFrom:
            - configMapRef:
                name: ecommerce-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
