apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-ui-config
  namespace: ecommerce
data:
  default.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        resolver 10.30.0.10 valid=5s ipv6=off;

        location /healthz { return 200 '{"status":"alive","service":"frontend"}'; add_header Content-Type application/json; }
        location /ready { return 200 '{"status":"ready","service":"frontend"}'; add_header Content-Type application/json; }
        location /api/frontend { return 200 '{"service":"frontend","version":"v1","duty":"Web UI & Reverse Proxy Gateway","nodePool":"general-pool"}'; add_header Content-Type application/json; }

        location /api/catalog { set $u "http://product-catalog:80/"; proxy_http_version 1.1; proxy_pass $u; }
        location /api/cart { set $u "http://cart:80/"; proxy_http_version 1.1; proxy_pass $u; }
        location /api/inventory { set $u "http://inventory:80/"; proxy_http_version 1.1; proxy_pass $u; }
        location /api/order { set $u "http://order:80/"; proxy_http_version 1.1; proxy_pass $u; }
        location /api/order-to-payment { set $u "http://order:80/pay"; proxy_http_version 1.1; proxy_pass $u; }
        location /api/payment-direct { set $u "http://payment:80/"; proxy_http_version 1.1; proxy_pass $u; }
        location /api/notification { set $u "http://notification:80/"; proxy_http_version 1.1; proxy_pass $u; }
    }
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8" />
      <title>HCL GKE + Istio Microservices Dashboard</title>
      <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .hdr { max-width: 1150px; margin: 0 auto 20px; background: #1e293b; padding: 18px 24px; border-radius: 10px; border-left: 6px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .hdr h1 { margin: 0 0 4px; font-size: 20px; color: #38bdf8; }
        .hdr p { margin: 0; color: #94a3b8; font-size: 13px; }
        .all-btn { background: #22c55e; color: #052e16; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .grid { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
        .card.crit { border-color: #f59e0b; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #0284c7; color: #e0f2fe; margin-bottom: 6px; }
        .tag.w { background: #b45309; color: #fef3c7; }
        h2 { margin: 0 0 6px; font-size: 17px; }
        .duty { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }
        button.b { background: #38bdf8; color: #0f172a; border: none; padding: 7px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-right: 6px; }
        button.r { background: #ef4444; color: #fff; border: none; padding: 7px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        pre { background: #020617; color: #4ade80; padding: 8px; border-radius: 5px; font-size: 12px; overflow-x: auto; margin: 10px 0 0; min-height: 38px; }
        pre.err { color: #f87171; }
      </style>
    </head>
    <body>
      <div class="hdr">
        <div>
          <h1>HCL Enterprise GKE + Istio Service Mesh Dashboard</h1>
          <p>7 E-Commerce Microservices | Strict mTLS | SPIFFE Zero-Trust AuthZ | Canary v1/v2</p>
        </div>
        <button class="all-btn" onclick="testAll()">Run Live Health Check on All 7 Services</button>
      </div>
      <div class="grid">
        <div class="card"><span class="tag">general-pool | HPA | PDB</span><h2>1. Frontend Service</h2><div class="duty"><strong>Duty:</strong> Storefront UI & API reverse-proxy gateway into the Istio mTLS mesh.</div><button class="b" onclick="go('/api/frontend','r1')">Test Frontend</button><pre id="r1">Ready...</pre></div>
        <div class="card"><span class="tag">general-pool | Envoy mTLS</span><h2>2. Product Catalog Service</h2><div class="duty"><strong>Duty:</strong> Serves product listings, SKUs, and pricing metadata.</div><button class="b" onclick="go('/api/catalog','r2')">Test Product Catalog</button><pre id="r2">Ready...</pre></div>
        <div class="card"><span class="tag">general-pool | Envoy mTLS</span><h2>3. Shopping Cart Service</h2><div class="duty"><strong>Duty:</strong> Manages customer shopping sessions and cart items.</div><button class="b" onclick="go('/api/cart','r3')">Test Cart</button><pre id="r3">Ready...</pre></div>
        <div class="card"><span class="tag">general-pool | Envoy mTLS</span><h2>4. Inventory Service</h2><div class="duty"><strong>Duty:</strong> Tracks real-time warehouse stock levels and reserves items.</div><button class="b" onclick="go('/api/inventory','r4')">Test Inventory</button><pre id="r4">Ready...</pre></div>
        <div class="card"><span class="tag">general-pool | SPIFFE: order-ksa</span><h2>5. Order Service</h2><div class="duty"><strong>Duty:</strong> Checkout orchestrator; ONLY service authorized via SPIFFE to call Payment.</div><button class="b" onclick="go('/api/order','r5')">Test Order</button><pre id="r5">Ready...</pre></div>
        <div class="card crit"><span class="tag w">critical-pool (Tainted) | Canary v1/v2</span><h2>6. Payment Service (v1 & v2)</h2><div class="duty"><strong>Duty:</strong> PCI-sensitive transactions on tainted nodes using GCP Secret Manager.</div><button class="b" onclick="go('/api/order-to-payment','r6')">Authorized (Order -> Payment)</button><button class="r" onclick="go('/api/payment-direct','r6')">Unauthorized (Frontend -> Payment)</button><pre id="r6">Ready...</pre></div>
        <div class="card"><span class="tag">general-pool | Envoy mTLS</span><h2>7. Notification Service</h2><div class="duty"><strong>Duty:</strong> Sends order confirmation emails and SMS alerts.</div><button class="b" onclick="go('/api/notification','r7')">Test Notification</button><pre id="r7">Ready...</pre></div>
      </div>
      <script>
        async function go(u, id) {
          const el = document.getElementById(id); el.className = ''; el.textContent = 'Calling ' + u + '...';
          try { const r = await fetch(u); const t = await r.text(); if (!r.ok) el.className = 'err'; el.textContent = 'HTTP ' + r.status + ' ' + r.statusText + '\n' + t; }
          catch (e) { el.className = 'err'; el.textContent = e.message; }
        }
        function testAll() { go('/api/frontend','r1'); go('/api/catalog','r2'); go('/api/cart','r3'); go('/api/inventory','r4'); go('/api/order','r5'); go('/api/order-to-payment','r6'); go('/api/notification','r7'); }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      nodeSelector:
        role: general
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: ui-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: ui-config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: ui-config
          configMap:
            name: frontend-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecommerce
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
