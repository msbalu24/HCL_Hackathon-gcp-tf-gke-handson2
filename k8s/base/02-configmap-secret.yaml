apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  ENVIRONMENT: "dev"
  CATALOG_SERVICE_URL: "http://product-catalog:80"
  CART_SERVICE_URL: "http://cart:80"
  ORDER_SERVICE_URL: "http://order:80"
  PAYMENT_SERVICE_URL: "http://payment:80"
  INVENTORY_SERVICE_URL: "http://inventory:80"
  NOTIFICATION_SERVICE_URL: "http://notification:80"
  NORMAL_TRAFFIC_RPM: "2000"
  PEAK_TRAFFIC_RPM: "10000"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-k8s-secret
  namespace: ecommerce
type: Opaque
stringData:
  GCP_SECRET_NAME: "hcl-dev-payment-api-key"
  PAYMENT_PROVIDER: "hcl-pay-secure-v1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-ksa
  namespace: ecommerce
  annotations:
    iam.gke.io/gcp-service-account: "hcl-dev-app-sa@hcl-hackathon-tf-gcp-demo2.iam.gserviceaccount.com"
