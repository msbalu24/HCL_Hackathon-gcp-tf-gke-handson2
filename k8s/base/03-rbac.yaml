apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecommerce-config-reader
  namespace: ecommerce
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ecommerce-config"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-payment-ksa-config-reader
  namespace: ecommerce
subjects:
  - kind: ServiceAccount
    name: payment-ksa
    namespace: ecommerce
roleRef:
  kind: Role
  name: ecommerce-config-reader
  apiGroup: rbac.authorization.k8s.io
