name: DevSecOps IaC & Kubernetes Governance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-validate-plan:
    name: Terraform Format, Validate & Keyless Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Switch Backend to Local for Keyless CI Plan
        run: sed -i 's/backend "gcs"/backend "local"/' environments/dev/backend.tf

      - name: Terraform Init & Validate
        working-directory: environments/dev
        run: |
          terraform init
          terraform validate

      - name: Generate Offline Terraform Plan JSON
        working-directory: environments/dev
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: "ci-offline-policy-validation-token"
        run: |
          terraform plan -refresh=false -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Upload Terraform Plan JSON
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-json
          path: environments/dev/tfplan.json

  checkov-security-scan:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Install Checkov
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Checkov Audit
        run: |
          pip install --quiet checkov
          checkov --config-file .checkov.yaml

  opa-policy-gate:
    name: OPA Conftest Rego v1 Policy Gate
    needs: terraform-validate-plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Terraform Plan JSON
        uses: actions/download-artifact@v4
        with:
          name: tfplan-json

      - name: Install Conftest & Enforce Rego Policies
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
          conftest test tfplan.json --policy policy/

  k8s-manifest-lint:
    name: Kubernetes & Istio Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Kubeconform & Validate Manifests
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          kubeconform -summary -ignore-missing-schemas k8s/base/ k8s/microservices/ k8s/istio/
