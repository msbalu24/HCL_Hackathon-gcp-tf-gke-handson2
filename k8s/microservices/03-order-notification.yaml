apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ecommerce
  labels:
    app: order
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order
      version: v1
  template:
    metadata:
      labels:
        app: order
        version: v1
    spec:
      nodeSelector:
        role: general
      containers:
        - name: order
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          command:
            - /bin/sh
            - -c
            - |
              cat << 'NGINX' > /etc/nginx/conf.d/default.conf
              server {
                  listen 8080;
                  location /healthz { return 200 '{"status":"alive","service":"order"}'; add_header Content-Type application/json; }
                  location /ready { return 200 '{"status":"ready","service":"order"}'; add_header Content-Type application/json; }
                  location /pay { proxy_pass http://payment:80/; }
                  location / { return 200 '{"service":"order","version":"v1","workflow":"Checkout-Orchestrator"}'; add_header Content-Type application/json; }
              }
              NGINX
              exec nginx -g 'daemon off;'
          envFrom:
            - configMapRef:
                name: ecommerce-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ecommerce
  labels:
    app: order
spec:
  type: ClusterIP
  selector:
    app: order
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
